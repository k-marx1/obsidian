<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif">
  <!-- Axes -->
  <line x1="50" y1="260" x2="380" y2="260" stroke="black" stroke-width="2"/>
  <line x1="50" y1="260" x2="50" y2="20"  stroke="black" stroke-width="2"/>
  <text x="365" y="280" font-size="12">T</text>
  <text x="30"  y="30"  font-size="12">P</text>

  <!-- Phase boundaries -->
  <!-- Sublimation curve -->
  <path d="M50 220 Q120 150 170 120" fill="none" stroke="black" stroke-width="2"/>
  <!-- Fusion curve -->
  <path d="M170 120 Q190 130 210 140" fill="none" stroke="black" stroke-width="2"/>
  <!-- Vaporization curve -->
  <path d="M170 120 Q230 80 280 70 T340 60" fill="none" stroke="black" stroke-width="2"/>

  <!-- Triple point F -->
  <circle cx="170" cy="120" r="4" fill="black"/>
  <text x="178" y="115" font-size="12">F (тройная точка)</text>

  <!-- Critical point C -->
  <circle cx="340" cy="60" r="4" fill="black"/>
  <text x="348" y="55" font-size="12">C (критическая точка)</text>

  <!-- Phase labels -->
  <text x="80"  y="90"  font-size="14">твердое</text>
  <text x="240" y="110" font-size="14">жидкое</text>
  <text x="260" y="230" font-size="14">газ</text>

  <!-- Phase transition labels -->
  <text x="90"  y="190" font-size="11">сублимация / десублимация</text>
  <text x="200" y="165" font-size="11">плавление / кристаллизация</text>
  <text x="245" y="140" font-size="11">испарение / конденсация</text>
</svg>
